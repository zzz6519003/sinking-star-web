<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>轻柔声场 · 音频验证</title><style>body{margin:40px auto;max-width:800px;background:#102124;color:#dfdcc2;font:15px/1.9 system-ui;padding:20px}button,a{padding:12px 20px;color:#d6c38d;border:1px solid #718b74;background:#243e39;cursor:pointer}canvas{width:100%;height:150px;margin:20px 0}audio{width:100%}#report{white-space:pre-wrap;color:#a5c4af}a{display:inline-block;margin-top:20px}</style><h1>轻柔声场 · 音频验证</h1><p>真实 Web Audio 离线渲染：三种脚步 → 推 → 拉 → 换位 → 归位 → 回溯 → 通关。</p><button id="render">生成试听与检测</button><p id="report" role="status">等待生成</p><canvas id="wave" width="800" height="150"></canvas><audio id="preview" controls></audio><a id="download" hidden download="soft-sounds.wav">下载试听</a><script type="module">
import {Ambience} from '../src/audio.js';
const button=document.querySelector('#render'),report=document.querySelector('#report');
button.onclick=async()=>{button.disabled=true;report.textContent='正在渲染真实音频…';try{
 const ctx=new OfflineAudioContext(2,Math.ceil(6.2*44100),44100),sound=new Ambience({contextFactory:()=>ctx,storage:{getItem:()=>null,setItem(){}}});sound.initialize();
 const events=[[.15,()=>sound.step('warrior')],[.48,()=>sound.step('thief')],[.81,()=>sound.step('wizard')],[1.15,()=>sound.action('push','warrior')],[1.65,()=>sound.action('pull','thief')],[2.18,()=>sound.action('swap','wizard')],[2.88,()=>sound.goal(true)],[3.65,()=>sound.undo()],[4.15,()=>sound.win()]];
 const paused=events.map(([time,play])=>ctx.suspend(time).then(()=>{play();return ctx.resume();}));
 const buffer=await ctx.startRendering();await Promise.all(paused);
 let peak=0,energy=0,finite=true;for(let ch=0;ch<2;ch++)for(const sample of buffer.getChannelData(ch)){peak=Math.max(peak,Math.abs(sample));energy+=sample*sample;if(!Number.isFinite(sample))finite=false;}
 const rms=Math.sqrt(energy/(buffer.length*2));if(!finite||peak<.001||peak>=.8)throw new Error('音频电平异常 '+peak);
 const windows=events.map(([time])=>{let sum=0;const samples=buffer.getChannelData(0),start=Math.floor((time+.01)*44100),end=start+4410;for(let i=start;i<end;i++)sum+=samples[i]*samples[i];return Math.sqrt(sum/4410);});if(windows.some(v=>v<.0001))throw new Error('某个事件没有产生声音');
 report.textContent=`通过 · 9 段音效均有输出\n时长 ${buffer.duration.toFixed(1)} 秒 · 峰值 ${(20*Math.log10(peak)).toFixed(1)} dBFS · RMS ${(20*Math.log10(rms)).toFixed(1)} dBFS\n无削波、无非有限值 · 立体声 44.1 kHz`;
 const canvas=document.querySelector('#wave'),c=canvas.getContext('2d');c.fillStyle='#18312f';c.fillRect(0,0,800,150);c.strokeStyle='#cfbc83';c.beginPath();const samples=buffer.getChannelData(0);for(let x=0;x<800;x++){let max=0;for(let i=Math.floor(x*buffer.length/800);i<Math.floor((x+1)*buffer.length/800);i++)max=Math.max(max,Math.abs(samples[i]));c.moveTo(x,75-max*900);c.lineTo(x,75+max*900);}c.stroke();
 const bytes=new ArrayBuffer(44+buffer.length*4),view=new DataView(bytes),write=(offset,text)=>[...text].forEach((char,i)=>view.setUint8(offset+i,char.charCodeAt(0)));write(0,'RIFF');view.setUint32(4,36+buffer.length*4,true);write(8,'WAVE');write(12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,2,true);view.setUint32(24,44100,true);view.setUint32(28,176400,true);view.setUint16(32,4,true);view.setUint16(34,16,true);write(36,'data');view.setUint32(40,buffer.length*4,true);for(let i=0;i<buffer.length;i++)for(let ch=0;ch<2;ch++)view.setInt16(44+(i*2+ch)*2,Math.round(Math.max(-1,Math.min(1,buffer.getChannelData(ch)[i]))*32767),true);
 const url=URL.createObjectURL(new Blob([bytes],{type:'audio/wav'}));document.querySelector('#preview').src=url;const download=document.querySelector('#download');download.href=url;download.hidden=false;
 }catch(error){report.textContent='失败：'+error.message;}finally{button.disabled=false;}};
</script></html>
